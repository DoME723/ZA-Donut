<style>
:root{--bg:#f2f0ec;--ink:#202228;--muted:#7b7d83;--line:#e7e2dc;--panel:#fff;--soft:#f3efea;--plus:#e2f2e5;--danger:#ad4841;--overlay:#0009}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;padding-bottom:calc(env(safe-area-inset-bottom) + 30px)}
button,input,select{font:inherit}
header{position:sticky;top:0;z-index:20;background:linear-gradient(145deg,#1e2026,#353944);color:#fff;padding:calc(env(safe-area-inset-top) + 14px) 15px 12px;box-shadow:0 4px 18px #0003}
.brand{display:flex;gap:10px;align-items:center}.logo{width:40px;height:40px;border-radius:13px;background:#fff1;border:1px solid #fff2;display:grid;place-items:center;font-size:22px}
h1{font-size:20px;margin:0;font-weight:900}.sub{font-size:10px;opacity:.72;margin-top:2px}.stats{margin-top:9px;display:flex;gap:6px}.pill{background:#fff1;border:1px solid #fff2;border-radius:999px;padding:6px 10px;font-size:10px;font-weight:800}
main{max-width:720px;margin:auto;padding:10px 12px}.tip{font-size:11px;color:#68645f;background:#fff8e8;border:1px solid #eee0b8;padding:9px 11px;border-radius:13px;margin-bottom:9px}
.type{background:#fff;border-radius:19px;margin:9px 0;overflow:hidden;border:1px solid #eae5df;box-shadow:0 3px 13px #0000000c}
.typehead{width:100%;border:0;display:flex;align-items:center;gap:11px;padding:11px 13px;text-align:left;position:relative}
.typeicon{width:54px;height:54px;flex:0 0 54px;border-radius:14px;overflow:hidden;border:1px solid #ffffff66;box-shadow:0 2px 8px #0003}.typeicon img{width:100%;height:100%;object-fit:cover;display:block}
.typename{flex:1;min-width:0}.typename strong,.typename span,.chev,.typecount{color:#fff;text-shadow:-1px -1px 0 #111,1px -1px 0 #111,-1px 1px 0 #111,1px 1px 0 #111,0 2px 2px #111}
.typename strong{display:block;font-size:17px;font-weight:950}.typename span{display:block;font-size:10px;margin-top:2px}.typecount{
  min-width:68px;text-align:center;background:#00000045;border:1px solid #ffffff55;
  border-radius:14px;padding:7px 10px;box-shadow:0 2px 8px #0002
}
.typecount b{font-size:24px;line-height:1;font-weight:950}
.typecount small{font-size:10px;font-weight:850}.chev{font-size:17px}
.levels{border-top:1px solid var(--line);padding:8px}.level{background:#faf8f5;border:1px solid #eee8e1;border-radius:15px;padding:10px;margin:8px 0}.lvhead{display:flex;align-items:center;margin-bottom:7px}.lvbadge{border-radius:999px;padding:7px 12px;font-size:15px;font-weight:950;color:#fff;text-shadow:0 1px 2px #000;background:#292c34}.lvsum{margin-left:auto;font-size:11px;color:var(--muted);font-weight:800}
.variant{background:#fff;border:1px solid #ebe5de;border-radius:14px;padding:10px;margin:7px 0}.vtop{display:flex;align-items:center;gap:7px}.bonuswrap{flex:1;min-width:0}.blabel{font-size:9px;color:var(--muted);margin-bottom:3px}.bonus{display:inline-block;background:#f2eee9;border-radius:999px;padding:5px 8px;font-size:11px;font-weight:850}
.qty{display:flex;align-items:center;gap:5px}.step{width:38px;height:38px;border:0;border-radius:11px;font-size:21px;font-weight:900}.minus{background:#eee9e4}.plus{background:var(--plus)}.count{min-width:36px;text-align:center;font-size:22px;font-weight:950;padding:3px}
.vactions{display:flex;justify-content:flex-end;margin-top:5px}.small{border:0;background:transparent;font-size:10px;color:#777;padding:5px 7px}.delete{color:#a64d46}
.add{width:100%;height:39px;border:1px dashed #beb5ac;background:#fffaf4;border-radius:12px;font-size:11px;font-weight:850;color:#5c5752}.empty{text-align:center;color:#99918a;font-size:10px;padding:7px}
.resetarea{text-align:center;border-top:1px solid #ddd6cf;margin-top:24px;padding-top:16px}.reset{border:0;background:transparent;color:#9b4942;text-decoration:underline;font-size:11px;padding:10px}footer{text-align:center;font-size:10px;color:#89837d;padding:10px}
.modal{position:fixed;inset:0;background:var(--overlay);display:none;align-items:flex-end;justify-content:center;z-index:100;padding:12px}.modal.show{display:flex}.sheet{width:min(100%,540px);background:#fff;border-radius:22px;padding:18px 16px calc(16px + env(safe-area-inset-bottom));box-shadow:0 14px 40px #0005}.sheet h2{font-size:18px;margin:0 0 4px}.sheet p{font-size:11px;color:#70737a;margin:0 0 13px}.field{margin:11px 0}.field label{display:block;font-size:10px;font-weight:850;margin-bottom:5px;color:#62656b}.field select,.field input{width:100%;height:47px;border:1px solid #d8d2cb;border-radius:13px;background:#fff;padding:0 11px;font-size:16px}.actions{display:flex;gap:8px;margin-top:14px}.actions button{flex:1;height:46px;border:0;border-radius:13px;font-weight:850}.cancel{background:#eee9e4}.primary{background:#272a32;color:#fff}.destructive{background:#b44840;color:#fff}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:7px}.quick button{height:37px;border:0;border-radius:10px;background:#f1ede8;font-weight:850}

.typehead.alltype{
  background:
    linear-gradient(90deg,
      #ff5f6d 0%,
      #ff9f43 14%,
      #ffd93d 28%,
      #6edb6e 42%,
      #42c9d9 56%,
      #4d7cff 70%,
      #8b5cf6 84%,
      #ff6ec7 100%) !important;
  background-size:180% 180%;
  animation:rainbowShift 8s ease-in-out infinite;
}
@keyframes rainbowShift{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}
.typehead.alltype .typecount{
  background:#00000055;
  border-color:#ffffff70;
}

</style>
</head>
<body>
<header><div class="brand"><div class="logo">🍩</div><div><h1>ZA ドーナツ手帳</h1><div class="sub">かがやきパワー ＋ おまけパワー在庫管理</div></div></div><div class="stats"><div class="pill" id="allCount">総在庫 0個</div><div class="pill">19カテゴリ</div></div></header>
<main><div class="tip">タイプを開いてかがやきLv→おまけパワー別に登録できるよ！</div><div id="list"></div><div class="resetarea"><button class="reset" id="resetBtn">すべての在庫をリセット</button></div><footer>在庫はこの端末に自動保存されます。</footer></main>

<div class="modal" id="editModal"><div class="sheet"><h2 id="editTitle">ドーナツを追加</h2><p id="editSub"></p>
<div class="field"><label>おまけパワー</label><select id="bonus"><option value="なし">なし</option><option value="でかでか">でかでかパワー</option><option value="ちびちび">ちびちびパワー</option><option value="オヤブン">オヤブンパワー</option><option value="そうぐう">そうぐうパワー</option></select></div>
<div class="field"><label>おまけパワー Lv.</label><select id="bonusLv"><option value="1">Lv.1</option><option value="2">Lv.2</option><option value="3">Lv.3</option></select></div>
<div class="field"><label>在庫数</label><input id="qtyInput" type="number" min="0" inputmode="numeric"><div class="quick"><button data-q="1">1</button><button data-q="5">5</button><button data-q="10">10</button><button data-q="20">20</button></div></div>
<div class="actions"><button class="cancel" id="editCancel">キャンセル</button><button class="primary" id="editSave">保存</button></div></div></div>

<div class="modal" id="qtyModal"><div class="sheet"><h2>在庫数を変更</h2><p id="qtySub"></p><div class="field"><input id="qtyDirect" type="number" min="0" inputmode="numeric"><div class="quick"><button data-qd="0">0</button><button data-qd="5">5</button><button data-qd="10">10</button><button data-qd="20">20</button></div></div><div class="actions"><button class="cancel" id="qtyCancel">キャンセル</button><button class="primary" id="qtySave">変更</button></div></div></div>

<div class="modal" id="confirmModal"><div class="sheet"><h2 id="confirmTitle">確認</h2><p id="confirmText"></p><div class="actions"><button class="cancel" id="confirmCancel">キャンセル</button><button class="destructive" id="confirmDo">実行する</button></div></div></div>

const KEY="za_donut_v7_stock",OPEN="za_donut_v7_open";
let data={},opened={},editTarget=null,qtyTarget=null,confirmAction=null;
function load(){try{data=JSON.parse(localStorage.getItem(KEY)||"{}");opened=JSON.parse(localStorage.getItem(OPEN)||"{}")}catch(e){data={};opened={}};TYPES.forEach(x=>{if(!data[x.name])data[x.name]={"1":[],"2":[],"3":[]};[1,2,3].forEach(l=>{if(!Array.isArray(data[x.name][l]))data[x.name][l]=[]})})}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));localStorage.setItem(OPEN,JSON.stringify(opened))}catch(e){}}
function show(id){document.getElementById(id).classList.add("show")}function hide(id){document.getElementById(id).classList.remove("show")}
function bonusText(v){if(v.bonus==="なし")return"おまけなし";const m={でかでか:"📏 でかでか",ちびちび:"🔹 ちびちび",オヤブン:"👑 オヤブン",そうぐう:"🧭 そうぐう"};return`${m[v.bonus]||v.bonus} Lv.${v.bonusLv}`}
function toggle(t){opened[t]=!opened[t];save();render()}
function change(t,l,i,d){data[t][l][i].qty=Math.max(0,data[t][l][i].qty+d);save();render()}
function openEdit(t,l,i=null){editTarget={t,l,i};const v=i===null?null:data[t][l][i];editTitle.textContent=v?"ドーナツを編集":"ドーナツを追加";editSub.textContent=`かがやきパワー：${t} Lv.${l}`;bonus.value=v?v.bonus:"なし";bonusLv.value=v?String(v.bonusLv||1):"1";qtyInput.value=v?v.qty:1;syncBonus();show("editModal")}
function syncBonus(){bonusLv.disabled=bonus.value==="なし"}
function saveEdit(){const {t,l,i}=editTarget,b=bonus.value,bl=b==="なし"?null:Number(bonusLv.value),q=Math.max(0,parseInt(qtyInput.value,10)||0),v={bonus:b,bonusLv:bl,qty:q};if(i===null)data[t][l].push(v);else data[t][l][i]=v;save();hide("editModal");render()}
function openQty(t,l,i){qtyTarget={t,l,i};const v=data[t][l][i];qtySub.textContent=`かがやき：${t} Lv.${l} / ${bonusText(v)}`;qtyDirect.value=v.qty;show("qtyModal")}
function saveQty(){const {t,l,i}=qtyTarget;data[t][l][i].qty=Math.max(0,parseInt(qtyDirect.value,10)||0);save();qtyTarget=null;hide("qtyModal");render()}
function askDelete(t,l,i){confirmAction=()=>{data[t][l].splice(i,1);save();render()};confirmTitle.textContent="このドーナツを削除";confirmText.textContent="この組み合わせの在庫枠を削除します。";show("confirmModal")}
function askReset(){confirmAction=()=>{TYPES.forEach(x=>[1,2,3].forEach(l=>data[x.name][l]=[]));save();render()};confirmTitle.textContent="すべての在庫をリセット";confirmText.textContent="登録した全ドーナツと在庫を削除します。";show("confirmModal")}
function render(){let all=0;list.innerHTML=TYPES.map(x=>{const t=x.name;let tt=0;[1,2,3].forEach(l=>data[t][l].forEach(v=>tt+=v.qty));all+=tt;const levels=[3,2,1].map(l=>{const lt=data[t][l].reduce((s,v)=>s+v.qty,0);const vs=data[t][l].map((v,i)=>`<div class="variant"><div class="vtop"><div class="bonuswrap"><div class="blabel">おまけパワー</div><div class="bonus">${bonusText(v)}</div></div><div class="qty"><button class="step minus" data-a="minus" data-t="${t}" data-l="${l}" data-i="${i}">−</button><div class="count" data-a="qty" data-t="${t}" data-l="${l}" data-i="${i}">${v.qty}</div><button class="step plus" data-a="plus" data-t="${t}" data-l="${l}" data-i="${i}">＋</button></div></div><div class="vactions"><button class="small" data-a="edit" data-t="${t}" data-l="${l}" data-i="${i}">編集</button><button class="small delete" data-a="delete" data-t="${t}" data-l="${l}" data-i="${i}">削除</button></div></div>`).join("");return`<div class="level"><div class="lvhead"><div class="lvbadge">かがやき Lv.${l}</div><div class="lvsum">計 ${lt}個</div></div>${vs||'<div class="empty">まだ登録なし</div>'}<button class="add" data-a="add" data-t="${t}" data-l="${l}">＋ このLvのドーナツを追加</button></div>`}).join("");return`<section class="type"><button class="typehead ${t==='ぜんぶ'?'alltype':''}" data-toggle="${t}" style="${t==='ぜんぶ'?'':'background:'+x.color}"><div class="typeicon"><img src="${x.img}" alt="${t}"></div><div class="typename"><strong>${t}</strong><span>かがやきパワー</span></div><div class="typecount"><b>${tt}</b><small> 個</small></div><div class="chev">${opened[t]?"⌃":"⌄"}</div></button>${opened[t]?`<div class="levels">${levels}</div>`:""}</section>`}).join("");allCount.textContent=`総在庫 ${all}個`}
document.addEventListener("click",e=>{const tg=e.target.closest("[data-toggle]");if(tg){toggle(tg.dataset.toggle);return}const a=e.target.closest("[data-a]");if(a){const t=a.dataset.t,l=Number(a.dataset.l),i=a.dataset.i===undefined?null:Number(a.dataset.i);if(a.dataset.a==="add")openEdit(t,l);if(a.dataset.a==="edit")openEdit(t,l,i);if(a.dataset.a==="delete")askDelete(t,l,i);if(a.dataset.a==="minus")change(t,l,i,-1);if(a.dataset.a==="plus")change(t,l,i,1);if(a.dataset.a==="qty")openQty(t,l,i);return}const q=e.target.closest("[data-q]");if(q)qtyInput.value=q.dataset.q;const qd=e.target.closest("[data-qd]");if(qd)qtyDirect.value=qd.dataset.qd})
bonus.addEventListener("change",syncBonus);editCancel.onclick=()=>hide("editModal");editSave.onclick=saveEdit;qtyCancel.onclick=()=>{qtyTarget=null;hide("qtyModal")};qtySave.onclick=saveQty;resetBtn.onclick=askReset;confirmCancel.onclick=()=>{confirmAction=null;hide("confirmModal")};confirmDo.onclick=()=>{if(confirmAction)confirmAction();confirmAction=null;hide("confirmModal")};
load();save();render();
</script></body></html>
